[tools]
node = "26.13.1" # Última LTS (Lithium); antes 24.21.0. Igual que el devcontainer y netlify.toml.
pnpm = "11.28.12" # Igual que packageManager en package.json; ajustes en pnpm-workspace.yaml (lockfile v9).
# pnpm 12 no: sus shims de .bin apuntan a node_modules/.pnpm/... y @slidev/cli 51 se cree "global" (falla el build).

[tasks.setup]
description = "Instalar dependencias desde el lockfile"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Servidor de Slidev (--open --remote; admite --port)"
run = "pnpm dev"

[tasks.build]
description = "Generar la presentación estática en dist/"
run = "pnpm build"

[tasks.check]
description = "Validar compilando (no hay lint ni tests)"
run = "pnpm build"

[tasks.export]
description = "Exportar a PDF (opcional: requiere playwright-chromium)"
run = "pnpm export"
